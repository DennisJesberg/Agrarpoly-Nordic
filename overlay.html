<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agrarpoly Overlay</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif;color:#fff}*{box-sizing:border-box}
#overlay{width:100%;height:100%;padding:28px 38px;position:relative}
.header{height:170px;display:grid;grid-template-columns:190px 1fr 230px;align-items:center;gap:18px}
.nordic{width:180px;height:150px;object-fit:contain;filter:drop-shadow(0 0 14px #e5092f66)}
.jesbergWrap{text-align:right}.created{font-size:22px;font-weight:1000;font-style:italic;letter-spacing:2px;text-shadow:0 0 10px #7dff00}.jesberg{width:220px;height:145px;object-fit:contain;mix-blend-mode:screen;filter:drop-shadow(0 0 18px #7dff0066)}
.title{text-align:center;font-size:clamp(46px,6vw,92px);font-weight:1000;letter-spacing:4px;line-height:.9;color:#fff;text-shadow:0 4px 0 #111,0 0 18px #e5092f,5px 8px 0 #a9001d;transform:skew(-5deg)}
.subtitle{font-size:18px;letter-spacing:8px;color:#ddd;margin-top:12px;text-shadow:none}
.main{position:absolute;left:50%;top:51%;transform:translate(-50%,-50%);width:min(1500px,92vw);display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:30px;align-items:end}
.box{background:linear-gradient(145deg,#090909ee,#171717dd);border:3px solid #9d0b24;border-radius:18px;padding:22px 24px;min-height:145px;box-shadow:0 0 28px #e5092f35, inset 0 0 20px #000}
.boxTitle{font-size:19px;font-weight:1000;letter-spacing:3px;font-style:italic;color:#fff;text-shadow:0 0 10px #e5092f}.name{font-size:clamp(26px,3vw,48px);font-weight:1000;margin-top:15px;word-break:break-word}.center{text-align:center;background:radial-gradient(circle,#32070d 0,#0a0a0aee 58%,#060606ee 100%);min-height:430px;padding:28px}.center .boxTitle{font-size:28px}.die{width:220px;height:220px;margin:18px auto;border-radius:30px;background:linear-gradient(145deg,#fff,#bfc2c5);color:#080808;display:flex;align-items:center;justify-content:center;font-size:128px;box-shadow:0 12px 0 #555,0 0 40px #e5092f66,inset -12px -15px 25px #888;transform:rotate(-7deg)}
.status{font-size:22px;font-weight:1000;color:#aaa}.status.active{color:#ff3b58}.small{color:#aaa;font-size:16px}.arrow{font-size:34px;color:#bbb;margin:6px 0}.eventGrid{display:none;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px auto 0;max-width:900px}.eventGrid.show{display:grid}.eventBack{height:70px;border:2px solid #ff334f;border-radius:10px;background:linear-gradient(145deg,#151515,#050505);box-shadow:0 0 12px #ff334f55;display:flex;align-items:center;justify-content:center;color:#d9a72d;font-size:28px;font-weight:1000}.eventCard{margin:16px auto 0;max-width:520px;padding:14px 18px;border:2px solid #c9a227;border-radius:14px;background:linear-gradient(145deg,#15110a,#070707);box-shadow:0 0 22px #c9a22735;opacity:0;transform:translateY(10px) scale(.96);transition:.25s}.eventCard.show{opacity:1;transform:none}.eventLabel{font-size:11px;letter-spacing:3px;color:#c9a227;font-weight:1000}.eventTitle{font-size:22px;font-weight:1000;margin-top:3px}.eventText{font-size:14px;color:#ddd;margin-top:4px}.eventEffect{font-size:13px;color:#ffcf4a;font-weight:900;margin-top:6px}.rollAnim{animation:rollStop .65s ease-out}@keyframes rollStop{0%{transform:rotate(-18deg) scale(.7);filter:blur(5px);opacity:.2}45%{transform:rotate(8deg) scale(1.15);filter:blur(1px);opacity:1}100%{transform:rotate(0deg) scale(1);filter:blur(0)}}
@media(max-width:1000px){.header{grid-template-columns:110px 1fr 140px;height:130px}.nordic{width:105px;height:110px}.jesberg{width:140px;height:105px}.created{font-size:14px}.main{grid-template-columns:1fr;top:55%;gap:10px}.center{order:-1;min-height:320px}.box{min-height:100px}.die{width:150px;height:150px;font-size:90px}.subtitle{font-size:10px;letter-spacing:4px}}
</style></head><body><div id="overlay">
<div class="header"><img class="nordic" src="/assets/nordic.png"><div class="title">AGRARPOLY<div class="subtitle">ONLINE GAMING</div></div><div class="jesbergWrap"><div class="created">TECHNIK UND UMSETZUNG</div><img class="jesberg" src="/assets/jesberg.png"></div></div>
<div class="main">
 <div class="box"><div class="boxTitle">AKTUELLER SPIELER</div><div id="current" class="name">–</div></div>
 <div class="box center"><div class="boxTitle">AGRARPOLY</div><div id="status" class="status">Warte auf Spielstart…</div><div id="die" class="die">–</div><div id="substatus" class="small">Der Master steuert die Freigabe.</div><div id="eventGrid" class="eventGrid"></div><div id="eventCard" class="eventCard"><div class="eventLabel">EREIGNISKARTE</div><div id="eventTitle" class="eventTitle">–</div><div id="eventText" class="eventText">–</div><div id="eventEffect" class="eventEffect"></div></div></div>
 <div class="box"><div class="boxTitle">NÄCHSTER SPIELER</div><div id="next" class="name">–</div><div class="arrow">↓</div><div class="small">Bereit für den nächsten Zug</div></div>
</div></div>
<script>
const p=new URLSearchParams(location.search);const server=p.get('server')||location.origin;const roomCode=p.get('code')||p.get('room')||'';const faces=['','1','2','3','4','5','6'];let socket,last=null;
function connect(){const sc=document.createElement('script');sc.src=server.replace(/\/$/,'')+'/socket.io/socket.io.js';sc.onload=()=>{socket=io(server);socket.on('connect',()=>{if(roomCode)socket.emit('observe',{code:roomCode})});socket.on('state',st=>{const c=st.players[st.currentPlayer],n=st.players[st.currentPlayer+1];document.getElementById('current').textContent=c?.name||'–';document.getElementById('next').textContent=n?.name||'–';const status=document.getElementById('status');const sub=document.getElementById('substatus');status.textContent=!st.started?'Warte auf Spielstart…':(st.event?(st.event.revealedCard?'EREIGNISKARTE AUFGEDECKT':(st.event.accessGranted?'WÄHLE EINE EREIGNISKARTE':'EREIGNISKARTEN GESPERRT')):(st.released?'WÜRFEL FREIGEGEBEN':'Warte auf Freigabe…'));status.className='status '+(st.released||st.event?.accessGranted?'active':'');sub.textContent=st.event?.revealedCard?'Master bestätigt die Karte mit WEITER.':(st.event?.accessGranted?'20 Karten freigegeben – der Spieler wählt eine Karte.':(st.event?'Der Master muss die Ereigniskarten freigeben.':'Der Master steuert die Freigabe.'));const die=document.getElementById('die');const value=c?.last||null;if(value&&value!==last){die.classList.remove('rollAnim');void die.offsetWidth;die.classList.add('rollAnim');last=value}die.textContent=value?faces[value]:'–';const card=document.getElementById('eventCard');const grid=document.getElementById('eventGrid');grid.innerHTML='';grid.classList.remove('show');card.classList.remove('show');if(st.event?.revealedCard){document.getElementById('eventTitle').textContent=st.event.revealedCard.title;document.getElementById('eventText').textContent=st.event.revealedCard.text;document.getElementById('eventEffect').textContent='Karte aufgedeckt – wartet auf Bestätigung durch den Master.';card.classList.add('show')}else if(st.lastEvent){document.getElementById('eventTitle').textContent=st.lastEvent.title;document.getElementById('eventText').textContent=st.lastEvent.text;document.getElementById('eventEffect').textContent='Karte bestätigt und ausgeführt.';card.classList.add('show')}else if(st.event?.accessGranted){document.getElementById('eventTitle').textContent='WÄHLE EINE EREIGNISKARTE';document.getElementById('eventText').textContent='20 Karten sind freigegeben. Der Spieler wählt eine Karte.';document.getElementById('eventEffect').textContent='Alle Karten bleiben verdeckt, bis eine ausgewählt wird.';for(let i=0;i<20;i++){const el=document.createElement('div');el.className='eventBack';el.textContent='?';grid.appendChild(el)}grid.classList.add('show');card.classList.add('show')}})};document.head.appendChild(sc)}connect();
</script></body></html>
